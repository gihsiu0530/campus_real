%YAML:1.0

verbosity: "INFO"

use_fej: true
integration: "rk4"
use_stereo: true
max_cameras: 2

# These can refine calibration online, but the initial values in
# kalibr_imucam_chain.yaml still need to be real ZED2i calibration values.
calib_cam_extrinsics: false
calib_cam_intrinsics: false
calib_cam_timeoffset: false
calib_imu_intrinsics: false
calib_imu_g_sensitivity: false

max_clones: 11
max_slam: 50
max_slam_in_update: 25
max_msckf_in_update: 40
dt_slam_delay: 1

gravity_mag: 9.81

feat_rep_msckf: "GLOBAL_3D"
feat_rep_slam: "ANCHORED_MSCKF_INVERSE_DEPTH"
feat_rep_aruco: "ANCHORED_MSCKF_INVERSE_DEPTH"

try_zupt: true
zupt_chi2_multipler: 0
zupt_max_velocity: 0.1
zupt_noise_multiplier: 10
zupt_max_disparity: 0.5
zupt_only_at_beginning: true

# Soft ground-vehicle dynamics constraints (P-VIDO-style vehicle-frame motion).
# vehicle_q_imu_to_vehicle is JPL [x,y,z,w], rotating IMU frame into vehicle frame.
# Identity assumes IMU x is forward, y is lateral, z is vertical.
try_vehicle_dynamics: true
vehicle_wheelbase: 1.66
vehicle_max_steering_angle_deg: 30.0
vehicle_q_imu_to_vehicle: [0.0, 0.0, 0.0, 1.0]
vehicle_sigma_lateral_velocity: 0.20
vehicle_sigma_vertical_velocity: 0.20
vehicle_sigma_roll_pitch_rate: 0.10
vehicle_sigma_yaw_rate_bound: 0.20
vehicle_min_forward_speed: 1.00
vehicle_yaw_rate_bound_margin: 0.50
vehicle_use_yaw_rate_bound: false
vehicle_chi2_multiplier: 50.0
vehicle_max_lateral_velocity_residual: 5.0
vehicle_max_vertical_velocity_residual: 3.0
vehicle_max_roll_pitch_rate_residual: 1.5
vehicle_max_yaw_rate_bound_residual: 3.0
vehicle_gate_log: true
vehicle_gate_log_path: "/tmp/zed2i_vehicle_dynamics_gate.csv"

init_window_time: 2.0
init_imu_thresh: 1.5
init_max_disparity: 10.0
init_max_features: 50

init_dyn_use: false
init_dyn_mle_opt_calib: false
init_dyn_mle_max_iter: 50
init_dyn_mle_max_time: 0.05
init_dyn_mle_max_threads: 6
init_dyn_num_pose: 6
init_dyn_min_deg: 10.0

init_dyn_inflation_ori: 10
init_dyn_inflation_vel: 100
init_dyn_inflation_bg: 10
init_dyn_inflation_ba: 100
init_dyn_min_rec_cond: 1e-12

init_dyn_bias_g: [0.0, 0.0, 0.0]
init_dyn_bias_a: [0.0, 0.0, 0.0]

record_timing_information: false
record_timing_filepath: "/tmp/zed2i_traj_timing.txt"

save_total_state: false
filepath_est: "/tmp/zed2i_ov_estimate.txt"
filepath_std: "/tmp/zed2i_ov_estimate_std.txt"
filepath_gt: "/tmp/zed2i_ov_groundtruth.txt"

use_klt: true
num_pts: 200
fast_threshold: 20
grid_x: 5
grid_y: 5
min_px_dist: 10
knn_ratio: 0.70
track_frequency: 30.0
downsample_cameras: false
num_opencv_threads: 4
histogram_method: "HISTOGRAM"

use_aruco: false
num_aruco: 1024
downsize_aruco: true

up_msckf_sigma_px: 1
up_msckf_chi2_multipler: 1
up_slam_sigma_px: 1
up_slam_chi2_multipler: 1
up_aruco_sigma_px: 1
up_aruco_chi2_multipler: 1

use_mask: false

relative_config_imu: "kalibr_imu_chain.yaml"
relative_config_imucam: "kalibr_imucam_chain.yaml"
